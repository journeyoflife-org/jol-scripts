[project]
name = "jol-scripts"
version = "0.1.0"
description = "Operational scripts for infrastructure management with audit logging and safety controls."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
include = ["lib*"]
exclude = ["tests*", "scripts*", "logs*", "docs*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "bandit>=1.7",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["S101"]  # assert in tests

[tool.bandit]
targets = ["lib", "scripts"]
skips = ["B101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=lib --cov-report=term-missing"
