name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # Weekly Monday 03:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
