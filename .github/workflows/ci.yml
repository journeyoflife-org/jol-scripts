name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check lib/ scripts/

      - name: Ruff format check
        run: ruff format --check lib/ scripts/

      - name: Bandit security scan
        run: bandit -c pyproject.toml -r lib/ scripts/

      - name: Mypy type check
        run: mypy lib/ scripts/

      - name: Pytest
        run: pytest --cov=lib --cov-report=term-missing
